[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uwoc"
version = "1.0.0"
description = "Underwater optical wireless communications toolbox: water optics, Monte Carlo channel, photodiode and camera links"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/gaschenb/Underwater-Communications-Toolbox"

[project.optional-dependencies]
gui = ["PyQt5>=5.15", "pyqtgraph>=0.13"]

[project.scripts]
uwoc = "uwoc.cli:main"
uwoc-gui = "uwoc.gui.app:main"

[tool.setuptools.packages.find]
include = ["uwoc*"]

